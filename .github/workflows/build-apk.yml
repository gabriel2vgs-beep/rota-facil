name: Gerar APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      # O Android SDK já vem instalado no computador do GitHub; só aceitamos as licenças.
      - name: Aceitar licenças do Android SDK
        continue-on-error: true
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.10.2" }
      - name: Testes da lógica (importação, bipagem, rota)
        run: gradle :core:test --no-daemon
      - name: Gerar APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: RotaFacil-APK
          path: app/build/outputs/apk/debug/app-debug.apk
